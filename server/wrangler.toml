# Живое демо на Cloudflare: Worker (API) + D1 (база) + Static Assets (веб-версия).
name = "arqa-shift-diary"
main = "src/worker.ts"
compatibility_date = "2026-10-01"

[vars]
TIME_ZONE = "Asia/Almaty"

[assets]
directory = "../app/dist"
# Любой адрес, которого нет среди файлов, отдаёт index.html (одностраничное приложение).
not_found_handling = "single-page-application"
# API и проверку живости обрабатывает Worker, всё остальное — статика.
run_worker_first = ["/api/*", "/health"]

[[d1_databases]]
binding = "DB"
database_name = "arqa-shift-diary"
database_id = "c0a92d11-b62f-42a6-aacb-b851aab162d9"
migrations_dir = "migrations"
